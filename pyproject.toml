[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-lease"
version = "0.1.0"
description = "Queue VRAM-hungry local servers behind one GPU lease, as URLs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gpu-lease contributors" }]
keywords = ["gpu", "vram", "cuda", "llama.cpp", "comfyui", "proxy", "queue", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gpu-lease = "gpu_lease.cli:main"

[project.urls]
Documentation = "https://github.com/your-org/gpu-lease#readme"
Source = "https://github.com/your-org/gpu-lease"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
